# 저평가 아파트 검색기 — 분석 대상 지역
#
# 법정동코드(5자리, LAWD_CD)는 PublicDataReader.code_bdong() 조회 결과로 검증함
# (data.go.kr 아파트 실거래가 API는 "구가 설치된 시"의 경우 시 단위 코드가 아니라
#  구 단위 코드로 조회해야 함 — 예: 수원시 41110이 아니라 장안/권선/팔달/영통구 코드 4개)
#
# 확장 시 이 파일에 지역만 추가하면 ingest 스크립트가 자동으로 포함해서 적재함.
#
# 2026-08-16 서울 전역 + 경기 전역으로 확장(v1.1). 이전 범위(서울 남부 11개구 +
# 경기 남부 핵심 11개시, 총 30개 코드)는 seoul_south/gyeonggi_south_core로 있었으며
# 신규 코드 39개가 이번에 추가됨(총 69개). 기존 30개 코드는 이미 5년치 적재돼 있어
# 재수집 불필요 — ingest/fetch_trades.py가 체크포인트로 신규분만 자동 스킵 없이 이어받음.

