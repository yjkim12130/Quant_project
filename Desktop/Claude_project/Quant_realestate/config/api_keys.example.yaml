  # 위 두 개는 같은 "국토교통부_실거래가 정보" 활용신청 하나로 함께 승인되는 경우가 많음
  transaction_price_key: ""

  # https://www.data.go.kr/data/15134735/openapi.do  — 건축HUB 건축물대장정보
