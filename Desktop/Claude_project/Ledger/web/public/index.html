<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#28a745">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<title>우리집 가계부</title>
<script type="module" src="app.js"></script>
</head>
<body>
<form id="login" class="login" hidden>
  <h1>💸 우리집 가계부</h1>
  <p id="login-error" class="error"></p>
  <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" required>
  <button>들어가기</button>
</form>

<div id="main" hidden>
  <header class="top">
    <h1>💸 우리집 가계부</h1>
    <button id="refresh" type="button">🔄 새로고침</button>
  </header>
  <p id="status" class="status"></p>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="0">💰 소비 입력</button>
    <button type="button" role="tab" data-tab="1">📊 상세 대시보드</button>
    <button type="button" role="tab" data-tab="2">📜 전체 내역 및 관리</button>
  </nav>
  <section data-panel="0">
    <h2>💰 빠른 소비 입력</h2>
    <iframe id="form" title="소비 입력 폼" height="1500"></iframe>
  </section>
  <section data-panel="1" id="dashboard"></section>
  <section data-panel="2" id="history"></section>
</div>
</body>
</html>
