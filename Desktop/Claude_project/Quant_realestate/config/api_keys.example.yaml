# 이 파일을 config/api_keys.local.yaml 로 복사한 뒤 실제 키를 채워넣으세요.
# api_keys.local.yaml 은 .gitignore에 등록되어 있어 git에 절대 올라가지 않습니다.
#
# 발급처: 공공데이터포털 (https://www.data.go.kr) — 아래 3개 서비스 각각 "활용신청" 필요
# 모두 "일반 인증키(Decoding)" 값을 사용하세요 (Encoding 키를 requests로 쓰면 이중 인코딩 오류 발생)

data_go_kr:
